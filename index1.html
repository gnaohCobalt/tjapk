<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5fbf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1511" media="(prefers-color-scheme: dark)">
  <title>Tải Tom and Jerry: Chase CN Version</title>

  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols Rounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* GHI CHÚ: muốn đổi màu chủ đạo, sửa các biến --md-sys-color-* ở phần 1 (bản sáng) và trong
       @media (prefers-color-scheme: dark) (bản tối). Có thể tạo bảng màu tại m3.material.io/theme-builder */
    /* ==========================================================================
       1. MATERIAL DESIGN 3 (MATERIAL YOU) COLOR SYSTEM & DESIGN TOKENS
       ========================================================================== */
    :root {
      color-scheme: light dark;
      
      /* Light Palette Defaults (Dynamic Emerald Green Expressive theme for Game) */
      --md-sys-color-primary: #006d42;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #92f7bc;
      --md-sys-color-on-primary-container: #002111;
      
      --md-sys-color-secondary: #4e6354;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #d1e8d5;
      --md-sys-color-on-secondary-container: #0c1f13;
      
      --md-sys-color-tertiary: #3a6471;
      --md-sys-color-tertiary-container: #bdebd8;
      --md-sys-color-on-tertiary-container: #002019;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;

      --md-sys-color-background: #f5fbf5;
      --md-sys-color-on-background: #171d19;

      --md-sys-color-surface: #f5fbf5;
      --md-sys-color-on-surface: #171d19;
      --md-sys-color-surface-variant: #dce5dd;
      --md-sys-color-on-surface-variant: #404943;
      --md-sys-color-outline: #707973;
      --md-sys-color-outline-variant: #c0c9c1;

      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #eff5ef;
      --md-sys-color-surface-container: #e9efe9;
      --md-sys-color-surface-container-high: #e3eae3;
      --md-sys-color-surface-container-highest: #dde4dd;

      /* M3 Elevation Shadows */
      --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.04);
      --md-sys-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.04);

      /* Typography */
      --md-ref-font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0.0, 0.0, 1.0);
      --md-sys-motion-duration-medium: 350ms;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Palette */
        --md-sys-color-primary: #76daa1;
        --md-sys-color-on-primary: #003920;
        --md-sys-color-primary-container: #005230;
        --md-sys-color-on-primary-container: #92f7bc;

        --md-sys-color-secondary: #b5ccba;
        --md-sys-color-on-secondary: #213527;
        --md-sys-color-secondary-container: #374b3d;
        --md-sys-color-on-secondary-container: #d1e8d5;

        --md-sys-color-tertiary: #a1cefd;
        --md-sys-color-tertiary-container: #1d4b58;
        --md-sys-color-on-tertiary-container: #bdebd8;
        --md-sys-color-error-container: #93000a;
        --md-sys-color-on-error-container: #ffdad6;

        --md-sys-color-background: #0f1511;
        --md-sys-color-on-background: #dde4dd;

        --md-sys-color-surface: #0f1511;
        --md-sys-color-on-surface: #dde4dd;
        --md-sys-color-surface-variant: #404943;
        --md-sys-color-on-surface-variant: #c0c9c1;
        --md-sys-color-outline: #8a938c;
        --md-sys-color-outline-variant: #404943;

        --md-sys-color-surface-container-lowest: #0a0f0c;
        --md-sys-color-surface-container-low: #171d19;
        --md-sys-color-surface-container: #1b211d;
        --md-sys-color-surface-container-high: #262b27;
        --md-sys-color-surface-container-highest: #313632;

        --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.3), 0px 1px 2px 0px rgba(0, 0, 0, 0.2);
        --md-sys-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.3), 0px 1px 2px 0px rgba(0, 0, 0, 0.2);
      }
    }

    /* Reset & Base Styling */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: var(--md-ref-font-family);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    a, button { touch-action: manipulation; }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Material Symbols Icon Utility */
    .icon {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      width: 1em;
      height: 1em;
      overflow: hidden;           /* font chưa tải: không lộ chữ "chevron_right"... */
      visibility: hidden;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      user-select: none;
      flex-shrink: 0;
    }
    .icons-ready .icon { visibility: visible; }

    /* Shell Container - Mobile/App View Centered on Desktop */
    /* Khung ứng dụng: 1 cột (compact/medium), 2 cột với ngăn điều hướng (expanded) */
    #app {
      --gutter: 1rem;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app-viewport {
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       2. M3 TOP APP BAR
       ========================================================================== */
    .md-top-app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--md-sys-color-surface);
      transition: background-color 200ms ease, box-shadow 200ms ease;
      padding-top: env(safe-area-inset-top);
    }

    .md-top-app-bar.scrolled {
      background-color: var(--md-sys-color-surface-container);
      box-shadow: var(--md-sys-elevation-1);
    }

    .md-top-app-bar__content {
      display: flex;
      align-items: center;
      height: 4rem;
      padding: 0 max(0.5rem, env(safe-area-inset-right)) 0 max(0.5rem, env(safe-area-inset-left));
      gap: 4px;
    }

    /* M3 Navigation Icon / Back Button */
    .md-icon-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background-color 200ms;
    }



    .md-top-app-bar__title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      padding: 0 8px;
    }

    /* ==========================================================================
       3. CONTENT & ANIMATIONS (SHARED AXIS / FADE)
       ========================================================================== */
    .md-content {
      flex: 1;
      width: 100%;
      max-width: 46rem;
      margin-inline: auto;
      padding: 0 max(var(--gutter), env(safe-area-inset-right)) 2rem max(var(--gutter), env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .md-content:focus { outline: none; }

    /* M3 Fade-Through / Shared Axis Transition */
    .screen-container {
      will-change: transform, opacity;
      animation: m3-fade-through var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized) forwards;
    }

    @keyframes m3-fade-through {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Game Header Banner Card */
    .app-hero {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
      padding: clamp(1rem, 4vw, 1.5rem);
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: 28px;
      margin-top: 0.5rem;
    }

    .app-hero__icon {
      width: clamp(4rem, 3rem + 8vw, 6rem);
      height: clamp(4rem, 3rem + 8vw, 6rem);
      border-radius: 22%;
      object-fit: cover;
      box-shadow: var(--md-sys-elevation-1);
      flex-shrink: 0;
    }
    .app-hero__text { flex: 1 1 12rem; min-width: 0; }

    .app-hero__text h1 {
      font-size: clamp(1.375rem, 1.1rem + 1.2vw, 1.875rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 4px;
      overflow-wrap: break-word;
    }
    .page-title {
      font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem);
      font-weight: 700;
      line-height: 1.25;
      padding: 0 0.5rem;
      margin-top: 0.5rem;
      overflow-wrap: break-word;
    }

    .app-hero__text p {
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .page-lead {
      font-size: 0.9375rem;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 8px;
      line-height: 1.5;
    }

    /* Section Header */
    .section-title {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.1px;
      color: var(--md-sys-color-primary);
      text-transform: uppercase;
      padding: 8px 8px 0 8px;
    }

    /* ==========================================================================
       4. M3 CARDS & LIST ITEMS
       ========================================================================== */
    .md-card {
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    /* M3 List Item */
    .md-list-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 16px;
      min-height: 4.5rem;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      text-align: left;
      width: 100%;
      text-decoration: none;
      transition: background-color 150ms;
    }

    .md-list-item:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 72px;
      right: 16px;
      height: 1px;
      background-color: var(--md-sys-color-outline-variant);
      opacity: 0.6;
    }

    /* M3 State Layer (Hover/Focus/Active) */


    /* Leading Avatar Container (Squircle) */
    .md-list-item__start {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background-color: var(--icon-bg, var(--md-sys-color-secondary-container));
      color: var(--icon-color, var(--md-sys-color-on-secondary-container));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .md-list-item__start .icon {
      font-size: 26px;
    }

    .md-list-item__content {
      flex: 1;
      min-width: 0;
    }

    .md-list-item__title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      line-height: 1.3;
    }

    .md-list-item__subtitle {
      font-size: 0.84rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;      /* màn hình hẹp / chữ lớn: xuống dòng thay vì cắt "…" */
    }

    .md-list-item__end {
      color: var(--md-sys-color-outline);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       5. BUTTONS & CALLOUT BANNERS
       ========================================================================== */
    .md-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 3.5rem;
      padding: 0.75rem 1.5rem;
      text-align: center;
      border-radius: 9999px; /* M3 Full Pill Shape */
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: var(--md-sys-elevation-1);
      transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
    }

    .md-button--primary {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .md-button--primary:hover {
      box-shadow: var(--md-sys-elevation-2);
      filter: brightness(1.05);
    }

    .md-button--primary:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .md-button--tonal {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      box-shadow: none;
    }

    .md-button--tonal:active {
      transform: scale(0.98);
    }

    /* Info Callout Banner */
    .md-banner {
      display: flex;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 20px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      align-items: flex-start;
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .md-banner .icon {
      color: var(--md-sys-color-on-tertiary-container);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .md-banner--warning {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .md-banner--warning .icon { color: var(--md-sys-color-on-error-container); }

    /* Footer Support Section */
    .app-footer {
      margin-top: auto;
      width: 100%;
      max-width: 46rem;
      margin-inline: auto;
      padding: 1.5rem max(var(--gutter), env(safe-area-inset-right)) calc(0.75rem + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
      text-align: center;
      font-size: 0.84rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .app-footer a {
      color: var(--md-sys-color-primary);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Accessibility & Motion Settings */
    @media (prefers-reduced-motion: reduce) {
      .screen-container {
        animation: none !important;
      }
      .md-button, .md-list-item {
        transition: none !important;
      }
    }

    /* ==========================================================================
       6. STATE LAYERS & FOCUS (hover chỉ trên thiết bị có chuột)
       ========================================================================== */
    .md-list-item::before, .md-icon-button::before, .md-nav-item::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--md-sys-color-on-surface);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms;
    }
    @media (hover: hover) {
      .md-list-item:hover::before, .md-icon-button:hover::before, .md-nav-item:hover::before { opacity: 0.08; }
    }
    .md-list-item:focus-visible::before, .md-icon-button:focus-visible::before, .md-nav-item:focus-visible::before { opacity: 0.12; }
    .md-list-item:active::before, .md-icon-button:active::before, .md-nav-item:active::before { opacity: 0.12; transition: none; }
    :where(a, button):focus-visible { outline: 3px solid var(--md-sys-color-primary); outline-offset: 2px; }
    .md-list-item:focus-visible, .md-nav-item:focus-visible { outline-offset: -3px; }
    .md-button--block { width: 100%; }

    /* ==========================================================================
       7. ADAPTIVE LAYOUT — M3 window size classes
          compact < 600  ·  medium 600–839  ·  expanded ≥ 840
       ========================================================================== */
    .md-rail { display: none; }
    .md-rail__brand { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem 1.25rem; color: var(--md-sys-color-on-surface); }
    .md-rail__brand img { width: 3rem; height: 3rem; border-radius: 22%; object-fit: cover; box-shadow: var(--md-sys-elevation-1); }
    .md-rail__brand strong { display: block; font-size: 1rem; line-height: 1.25; }
    .md-rail__brand span { font-size: 0.8125rem; color: var(--md-sys-color-on-surface-variant); }
    .md-rail__label { font-size: 0.875rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant); padding: 0.5rem 1rem; }
    .md-nav-item {
      position: relative; display: flex; align-items: center; gap: 0.75rem;
      min-height: 3.5rem; padding: 0 1rem; border-radius: 1.75rem; overflow: hidden;
      font-weight: 600; color: var(--md-sys-color-on-surface-variant);
    }
    .md-nav-item[aria-current="page"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

    @media (min-width: 600px) {
      #app { --gutter: 1.5rem; }
    }
    @media (min-width: 840px) {
      #app { --gutter: 2rem; display: grid; grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr); }
      .md-rail {
        display: flex; flex-direction: column; gap: 0.25rem;
        position: sticky; top: 0; align-self: start;
        height: 100vh; height: 100dvh; overflow-y: auto;
        padding: max(1.5rem, env(safe-area-inset-top)) 1rem 1.5rem max(1rem, env(safe-area-inset-left));
        background: var(--md-sys-color-surface-container-low);
        border-inline-end: 1px solid var(--md-sys-color-outline-variant);
      }
      .md-card--home { display: none; }      /* danh sách nền tảng đã nằm ở ngăn bên trái */
    }
    @media (min-width: 1600px) { html { font-size: 112.5%; } }
    @media (max-width: 22.5rem) {
      .app-hero { flex-direction: column; text-align: center; }
      .md-list-item { padding: 0.75rem; gap: 0.75rem; }
      .md-list-item:not(:last-child)::after { left: 4rem; right: 0.75rem; }
    }
    @media (max-height: 30rem) and (orientation: landscape) {
      .md-top-app-bar__content { height: 3.5rem; }
      .md-list-item { min-height: 4rem; padding-block: 0.5rem; }
    }
    @media (prefers-contrast: more) {
      .md-card, .md-banner { border: 2px solid var(--md-sys-color-outline); }
    }
  </style>
</head>
<body>
  <!-- Nội dung chữ & link nằm trong khối "CẤU HÌNH NỘI DUNG" ở cuối file (tìm chữ SITE / LINKS / PAGES) -->

  <div id="app">
  <nav class="md-rail" id="rail" aria-label="Nền tảng"></nav>
  <div id="app-viewport">
    <!-- Dynamic Top App Bar -->
    <header class="md-top-app-bar" id="top-bar">
      <div class="md-top-app-bar__content">
        <button class="md-icon-button" id="nav-back-btn" aria-label="Quay lại" style="display: none;">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="md-top-app-bar__title" id="bar-title">Tom &amp; Jerry: Chase</div>
      </div>
    </header>

    <!-- Main Dynamic Screen Slot -->
    <main class="md-content" id="main-content" aria-live="polite" tabindex="-1"></main>

    <!-- App Footer -->
    <footer class="app-footer" id="app-footer"></footer>
  </div>
  </div>

  <!-- ==========================================================================
       ⚙️ CẤU HÌNH NỘI DUNG — ĐÂY LÀ PHẦN BẠN SỬA CHỮ & LINK
       Chỉ cần sửa trong file này, không phải đụng tới code bên dưới.
       ==========================================================================
       CÁCH SỬA NHANH
       1) Đổi LINK tải ............ sửa trong khối LINKS (mỗi link 1 dòng, có tên rõ ràng).
       2) Đổi tên game / footer ... sửa trong khối SITE.
       3) Đổi CHỮ của từng trang .. sửa trong khối PAGES (title, lead, sub, text...).
       4) Thêm 1 nút tải .......... thêm 1 dòng { btn: { text: '...', href: LINKS.xxx } } vào "blocks" của trang.
       5) Thêm 1 dòng danh sách ... thêm { to: 'khoa-trang', title: '...', sub: '...', icon: '...', tone: '...' } vào "rows".
       6) Thêm 1 trang mới ........ thêm 1 mục mới vào PAGES; khóa (key) chính là phần sau dấu # của URL.

  <!-- ==========================================================================
       🔧 MÃ DỰNG GIAO DIỆN — thường KHÔNG cần sửa phần này
       ========================================================================== -->
  <script>
    /* ── Tiện ích ───────────────────────────────────────────────────────────── */
    // Chuyển ký tự đặc biệt thành an toàn để chữ bạn gõ ở phần cấu hình luôn hiển thị đúng
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Màu ô icon: tên "tone" -> [màu nền, màu icon] theo bảng màu Material 3 ở phần CSS
    const TONES = {
      primary:   ['--md-sys-color-primary-container',           '--md-sys-color-on-primary-container'],
      secondary: ['--md-sys-color-secondary-container',         '--md-sys-color-on-secondary-container'],
      tertiary:  ['--md-sys-color-tertiary-container',          '--md-sys-color-on-tertiary-container'],
      neutral:   ['--md-sys-color-surface-container-highest',   '--md-sys-color-on-surface']
    };

    const mainEl  = document.getElementById('main-content');
    const topBarEl = document.getElementById('top-bar');
    const barTitleEl = document.getElementById('bar-title');
    const backBtnEl = document.getElementById('nav-back-btn');
    const railEl  = document.getElementById('rail');
    const footerEl = document.getElementById('app-footer');

    /* ── Dựng các thành phần giao diện ──────────────────────────────────────── */
    // Một dòng trong danh sách (đi tới trang khác hoặc mở link ngoài)
    function listItem(item) {
      const internal = item.to !== undefined;
      const [bg, fg] = TONES[item.tone] || TONES.secondary;
      return `
        <a class="md-list-item" href="${esc(internal ? '#' + item.to : item.href)}"${internal ? '' : ' target="_blank" rel="noopener"'}>
          <div class="md-list-item__start" style="--icon-bg: var(${bg}); --icon-color: var(${fg})">
            <span class="icon">${esc(item.icon)}</span>
          </div>
          <div class="md-list-item__content">
            <div class="md-list-item__title">${esc(item.title)}</div>
            ${item.sub ? `<div class="md-list-item__subtitle">${esc(item.sub)}</div>` : ''}
          </div>
          <div class="md-list-item__end"><span class="icon">${internal ? 'chevron_right' : 'north_east'}</span></div>
        </a>`;
    }

    // Một khối nội dung (warn / note / btn / group)
    function block(b) {
      if (b.warn) return `
        <div class="md-banner md-banner--warning" role="note">
          <span class="icon">warning</span>
          <div><strong>${esc(b.warn.title)}</strong><br>${esc(b.warn.text)}</div>
        </div>`;
      if (b.note) return `
        <div class="md-banner">
          <span class="icon">info</span>
          <div>${esc(b.note)}</div>
        </div>`;
      if (b.btn) return `
        <a href="${esc(b.btn.href)}" target="_blank" rel="noopener" class="md-button md-button--primary md-button--block">
          <span class="icon">${esc(b.btn.icon || 'download')}</span>
          <span>${esc(b.btn.text)}</span>
        </a>`;
      if (b.group) return `
        <div class="section-title">${esc(b.group)}</div>
        <div class="md-card">${(b.items || []).map(listItem).join('')}</div>`;
      return '';
    }

    // Ngăn điều hướng bên trái (chỉ hiện ở màn hình rộng ≥ 840px), lấy từ danh sách ở trang chủ
    function buildRail() {
      railEl.innerHTML = `
        <a class="md-rail__brand" href="#">
          <img src="${LOGO}" alt="" width="48" height="48">
          <div><strong>${esc(SITE.name)}</strong><span>${esc(SITE.subtitle)}</span></div>
        </a>
        <div class="md-rail__label">${esc(SITE.platformLabel)}</div>
        ${PAGES[''].rows.map((r) => `<a class="md-nav-item" href="#${esc(r.to)}" data-to="${esc(r.to)}"><span class="icon">${esc(r.icon)}</span><span>${esc(r.title)}</span></a>`).join('')}`;
    }

    function buildFooter() {
      footerEl.innerHTML = `<p>${esc(SITE.supportText)} <a href="${esc(SITE.supportLink)}" target="_blank" rel="noopener">${esc(SITE.supportLinkText)}</a>.</p>`;
    }

    /* ── Hiển thị một trang theo khóa (key) ─────────────────────────────────── */
    function renderScreen(key) {
      const page = PAGES[key] || PAGES[''];
      const parent = key ? key.split('/').slice(0, -1).join('/') : null; // null = đang ở trang chủ

      // Nút quay lại: chỉ hiện khi không ở trang chủ
      backBtnEl.style.display = parent === null ? 'none' : 'inline-flex';
      backBtnEl.onclick = () => { location.hash = '#' + parent; };

      barTitleEl.textContent = page.name || SITE.name;
      document.title = key ? `${page.title} · ${SITE.titleSuffix}` : SITE.homeTabTitle;

      // Đánh dấu mục đang chọn ở ngăn bên trái
      railEl.querySelectorAll('.md-nav-item').forEach((a) => {
        if (a.dataset.to === key.split('/')[0]) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });

      let html = '<div class="screen-container">';
      if (page.showHero) {
        html += `
          <div class="app-hero">
            <img src="${LOGO}" alt="Logo ${esc(SITE.name)}" class="app-hero__icon">
            <div class="app-hero__text"><h1>${esc(page.title)}</h1><p>${esc(SITE.subtitle)}</p></div>
          </div>`;
      } else {
        html += `<h1 class="page-title">${esc(page.title)}</h1>`;
      }
      if (page.lead) html += `<p class="page-lead">${esc(page.lead)}</p>`;
      if (page.rows) html += `<div class="md-card${key === '' ? ' md-card--home' : ''}">${page.rows.map(listItem).join('')}</div>`;
      (page.blocks || []).forEach((b) => { html += block(b); });
      html += '</div>';

      mainEl.innerHTML = html;
      window.scrollTo(0, 0);
      mainEl.focus({ preventScroll: true });
    }

    /* ── Điều hướng bằng #hash trên URL ─────────────────────────────────────── */
    // Đổi địa chỉ (#...) thành khóa trang; địa chỉ lạ sẽ lùi về trang gần nhất
    function resolveRoute() {
      const hash = location.hash.replace(/^#\/?/, '').replace(/\/$/, '').toLowerCase();
      if (PAGES[hash]) return hash;
      if (hash.startsWith('ios')) return 'ios';
      if (hash.startsWith('windows')) return 'windows';
      if (hash.startsWith('android/channels')) return 'android/channels';
      if (hash.startsWith('android')) return 'android';
      return '';
    }
    const onHashChange = () => renderScreen(resolveRoute());

    // Thanh trên đổ bóng khi cuộn
    window.addEventListener('scroll', () => topBarEl.classList.toggle('scrolled', window.scrollY > 12), { passive: true });

    // Chỉ hiện icon khi font Material Symbols đã tải xong (tránh lộ chữ "chevron_right"...)
    function showIconsWhenReady() {
      document.fonts.load('24px "Material Symbols Rounded"', 'home')
        .then((f) => { if (f.length) document.documentElement.classList.add('icons-ready'); })
        .catch(() => {});
    }

    // Khởi chạy sau khi trang đã tải xong (lúc này LOGO ở cuối file cũng đã sẵn sàng)
    function init() {
      buildRail();
      buildFooter();
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.href = LOGO;
      document.head.appendChild(favicon);
      window.addEventListener('hashchange', onHashChange);
      onHashChange();
      if (document.fonts && document.fonts.load) {
        document.readyState === 'complete' ? showIconsWhenReady() : window.addEventListener('load', showIconsWhenReady);
      }
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <!-- ==========================================================================
       🖼️ LOGO (ảnh mã hóa base64, 1 dòng rất dài) — KHÔNG sửa tay.
       Muốn đổi logo: chuyển ảnh mới sang base64 (VD: base64.guru/converter/encode/image)
       rồi dán thay phần sau "const LOGO = '" cho tới dấu nháy đóng.
